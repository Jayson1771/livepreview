deploy-dashboard:
  name: Build & Deploy Dashboard
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: "20" }

    - name: Install & Build
      working-directory: dashboard
      run: |
        npm ci
        npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.https://psqtzamyddruxohocpaf.supabase.co }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzcXR6YW15ZGRydXhvaG9jcGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MDk2OTksImV4cCI6MjA4ODI4NTY5OX0.mSNA9MFMMDWz-tR2IICdsAI2xp3eXWzwDA8337y4eI0 }}
        VITE_API_URL: ${{ secrets.livepreview.onrender.com }}
        VITE_TUNNEL_DOMAIN: ${{ secrets.livepreview.onrender.com/api }}

    - name: Upload dist to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "dashboard/dist/*"
        target: "/var/www/livepreview/dashboard/dist"
        strip_components: 2
